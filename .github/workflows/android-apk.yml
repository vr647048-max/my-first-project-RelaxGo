name: Build TherapyOnWay Android APK
# Rebuild after provider live-location fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build customer and provider APKs
        working-directory: android
        run: gradle clean :app:assembleDebug :customer:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        working-directory: android
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s customer/build/outputs/apk/debug/customer-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk customer/build/outputs/apk/debug/customer-debug.apk

      - name: Publish public APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.4.2 >/dev/null 2>&1 || gh release create v1.4.1 --title "TherapyOnWay Provider Android App v1.4.2" --notes "Provider/Admin operations app for TherapyOnWay."
          gh release upload v1.4.1 android/app/build/outputs/apk/debug/app-debug.apk --clobber
          gh release view v1.0.5 >/dev/null 2>&1 || gh release create v1.0.4 --title "TherapyOnWay Customer Android App v1.0.5" --notes "Customer booking app for TherapyOnWay."
          gh release upload v1.0.4 android/customer/build/outputs/apk/debug/customer-debug.apk --clobber


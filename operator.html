<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>TherapyOnWay | Operator App</title><link rel="manifest" href="operator-manifest.json"><meta name="theme-color" content="#0f766e"><meta name="mobile-web-app-capable" content="yes"><link rel="stylesheet" href="style.css"></head><body class="dashboard">
<header class="topbar"><a class="brand" href="index.html">Therapy<span>OnWay</span></a><div class="dash-title">Operator App</div><a href="index.html">Customer Site</a></header>
<main class="dash-wrap"><section id="loginPanel" class="login-panel"><div class="pill">SECURE PROVIDER ACCESS</div><h1>Operator Login</h1><p>Use the provider account created in Supabase Authentication.</p>
<form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn primary full">Login</button></form><div id="loginMsg"></div></section>
<section id="dashboardPanel" class="hidden"><div class="dash-head"><div><div class="pill">LIVE OPERATIONS</div><h1>Bookings</h1><p>Accept bookings, navigate, call/WhatsApp customers and share live location.</p></div><button class="btn secondary" onclick="logout()">Logout</button></div>
<div id="stats" class="stats"></div><div class="admin-tools"><label>Filter <select id="statusFilter" onchange="render()"><option value="all">All bookings</option><option value="New">New</option><option value="Accepted">Accepted</option><option value="On the Way">On the Way</option><option value="Arrived">Arrived</option><option value="Completed">Completed</option></select></label><label>Payment <select id="paymentFilter" onchange="render()"><option value="all">All payments</option><option value="paid">Paid</option><option value="unpaid">Unpaid</option><option value="failed">Failed</option><option value="refunded">Refunded</option></select></label></div><div id="bookingList" class="booking-list"></div><div id="chatPanel" class="chat-panel hidden"><div class="chat-head"><b id="chatTitle">Customer Chat</b><button class="btn secondary" onclick="closeChat()">Close</button></div><div id="chatMessages" class="chat-messages"></div><form id="chatForm" class="chat-form"><input id="chatInput" maxlength="2000" placeholder="Type a message to customer…" required><button class="btn primary">Send</button></form></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')}</script><script src="config.js"></script><script src="admin.js"></script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('operator-sw.js').catch(()=>{});}</script></body></html>

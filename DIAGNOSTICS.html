<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TherapyOnWay | Diagnostics</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f8f6;color:#17322b;margin:0;padding:28px}.box{max-width:760px;margin:auto;background:#fff;border:1px solid #dfe9e4;border-radius:18px;padding:26px;box-shadow:0 12px 40px rgba(20,60,45,.08)}h1{margin:0 0 8px}.muted{color:#687873}.check{display:flex;gap:12px;align-items:flex-start;padding:14px;margin:10px 0;border-radius:12px;background:#f7faf9}.ok{background:#e9f7f0}.bad{background:#fff0f0}.wait{background:#fff8e6}.icon{font-size:20px;min-width:24px}.name{font-weight:900}.detail{font-size:13px;color:#687873;margin-top:3px;word-break:break-word}.btn{display:inline-block;border:0;border-radius:10px;background:#075b45;color:#fff;padding:12px 16px;font-weight:900;cursor:pointer;margin-top:10px}.small{font-size:12px;margin-top:18px}.small code{background:#eef3f0;padding:2px 5px;border-radius:5px}
</style>
</head>
<body><main class="box"><h1>TherapyOnWay diagnostics</h1><p class="muted">This page checks the browser setup and the Supabase tracking function without creating a booking.</p><div id="checks"></div><button class="btn" onclick="runChecks()">Run checks again</button><p class="small">If the tracking RPC check fails with “function does not exist”, run the complete <code>schema.sql</code> in Supabase SQL Editor once.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')}</script><script src="config.js"></script>
<script>
const checks=document.getElementById('checks');
function add(name,state,detail){const c=document.createElement('div');c.className='check '+state;c.innerHTML='<div class="icon">'+(state==='ok'?'✅':state==='bad'?'❌':'⚠️')+'</div><div><div class="name">'+name+'</div><div class="detail">'+detail+'</div></div>';checks.appendChild(c)}
async function runChecks(){
  checks.innerHTML='';
  add('Configuration',window.THERAPY_CONFIG?'ok':'bad',window.THERAPY_CONFIG?'Supabase URL and provider configuration loaded.':'config.js did not load.');
  if(typeof window.supabase==='undefined'){add('Supabase SDK','bad','The Supabase JavaScript SDK could not load. Check internet access.');return;}
  add('Supabase SDK','ok','SDK loaded successfully.');
  const C=window.THERAPY_CONFIG||{};
  if(!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY){add('Supabase credentials','bad','SUPABASE_URL or SUPABASE_ANON_KEY is missing.');return;}
  const sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
  try{const {error}=await sb.rpc('get_booking_tracking',{p_booking_id:'TOW-DIAGNOSTIC-NOT-A-REAL-BOOKING'});if(error){add('Tracking database function','bad',error.message)}else{add('Tracking database function','ok','get_booking_tracking() is available. Database setup is ready for customer tracking.')}}catch(e){add('Tracking database function','bad',String(e))}
  if(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1') add('GPS security context','ok','This page is running in a GPS-allowed secure/loopback context.');
  else add('GPS security context','bad','GPS requires HTTPS or localhost/127.0.0.1.');
}
runChecks();
</script></body></html>
